name: Materialize BANK16F master PASS

on:
  push:
    paths:
      - "releases/BANK16F/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact BANK16F ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bank16f
          cat releases/BANK16F/base64/part-*.txt > /tmp/BANK16F.b64
          base64 --decode /tmp/BANK16F.b64 > /tmp/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip
          echo "e0e7374844aedae1f01941ab4acdd89130afcd0797a7db1616e211b6d303730b  /tmp/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip" | sha256sum -c -

      - name: Extract working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine
          mkdir -p engine releases/BANK16F
          unzip -q /tmp/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip -d /tmp/bank16f
          cp -a /tmp/bank16f/bank16f_work/. engine/
          rm -f engine/SCUMM_HIBRIDO_LOG.txt engine/SCUMM_HIBRIDO_MAPA_MILESTONES.txt
          cp /tmp/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip releases/BANK16F/
          rm -rf releases/BANK16F/base64 releases/BANK16F/READY

      - name: Commit exact PASS master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "master: materialize BANK16F PASS engine"
          git push
