name: Verify and materialize BANK16F master PASS

on:
  push:
    paths:
      - "releases/BANK16F/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip"
      - "releases/BANK16F/SHA256SUMS.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact PASS snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd releases/BANK16F
          sha256sum -c SHA256SUMS.txt

      - name: Extract complete working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine /tmp/bank16f
          mkdir -p engine /tmp/bank16f
          unzip -q releases/BANK16F/TEST_BANK16F_POSTINTRO_CPU_FILL_8D00_8FFF.zip -d /tmp/bank16f
          cp -a /tmp/bank16f/bank16f_work/. engine/
          # docs/ contains the live/current documentation; avoid restoring the older
          # copies that were bundled inside the historical PASS ZIP.
          rm -f engine/SCUMM_HIBRIDO_LOG.txt engine/SCUMM_HIBRIDO_MAPA_MILESTONES.txt

      - name: Commit materialized engine tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine
          if git diff --cached --quiet; then
            echo "Engine tree already matches BANK16F."
            exit 0
          fi
          git commit -m "master: materialize BANK16F PASS engine tree"
          git push
